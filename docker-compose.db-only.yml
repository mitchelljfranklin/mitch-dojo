# Development database only — run the app itself with npm run dev.
# All values inline: the local .env DATABASE_URL defaults match these.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitch
      POSTGRES_PASSWORD: mitch
      POSTGRES_DB: mitch_dojo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitch -d mitch_dojo"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512m

volumes:
  db_data:
