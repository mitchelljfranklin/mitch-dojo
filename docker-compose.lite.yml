# Lite mode: a single container with an embedded PostgreSQL (PGlite).
# No separate database service — data lives in the pglite_data volume.
# Same image, same migrations, same app; only the connection mode differs.
services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: pglite
      DATABASE_DIR: /app/.data/pglite
      # CHANGE THESE THREE before exposing the app publicly — each must be
      # 32+ characters (generate with: openssl rand -hex 32). The container
      # refuses to start if CRON_SECRET is shorter than 32.
      AUTH_SECRET: "change-me-AUTH-SECRET-generate-with-openssl-rand-hex-32"
      APP_ENCRYPTION_KEY: "change-me-ENCRYPTION-KEY-generate-with-openssl-rand-hex-32"
      CRON_SECRET: "change-me-CRON-SECRET-generate-with-openssl-rand-hex-32"
      APP_URL: http://localhost:3000
      DATA_STORAGE_PATH: /app/.storage/files
      TRUSTED_PROXY_COUNT: 0
      # The dojo's time zone — check-in ("today's classes"), reminders,
      # analytics, and the schedule all key off the server's local day.
      # Set this to your IANA zone; the default here is Brisbane (UTC+10,
      # no daylight saving).
      TZ: Australia/Brisbane
      # Pre-migration database backups (kept: last 3) land here so they
      # survive container rebuilds. See docs/deployment for the restore steps.
      PGLITE_BACKUP_DIR: /app/.data/backups
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/.storage
      - pglite_data:/app/.data/pglite
      - pglite_backups:/app/.data/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 1g

volumes:
  app_data:
  pglite_data:
  pglite_backups:
