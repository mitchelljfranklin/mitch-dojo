# App + PostgreSQL 17 for production — build from source.
# All environment values are inline: edit the three change-me secrets and
# `docker compose up -d --build` (no .env file needed).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitch
      POSTGRES_PASSWORD: mitch
      POSTGRES_DB: mitch_dojo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitch -d mitch_dojo"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512m

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgres
      DATABASE_URL: "postgresql://mitch:mitch@db:5432/mitch_dojo?schema=public"
      # CHANGE THESE THREE before exposing the app publicly — each must be
      # 32+ characters (generate with: openssl rand -hex 32). The container
      # refuses to start if CRON_SECRET is shorter than 32.
      AUTH_SECRET: "change-me-AUTH-SECRET-generate-with-openssl-rand-hex-32"
      APP_ENCRYPTION_KEY: "change-me-ENCRYPTION-KEY-generate-with-openssl-rand-hex-32"
      CRON_SECRET: "change-me-CRON-SECRET-generate-with-openssl-rand-hex-32"
      APP_URL: http://localhost:3000
      DATA_STORAGE_PATH: /app/.storage/files
      TRUSTED_PROXY_COUNT: 0
    # For local development the app port is exposed to the host. For
    # production behind a reverse proxy (Caddy/nginx), either remove this
    # port mapping or switch to an internal-only network so the app port
    # is reachable only by the proxy. A directly reachable app port lets
    # clients spoof X-Forwarded-For.
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/.storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 1g

volumes:
  db_data:
  app_data:
