name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (latest, v1.0.0, etc.)"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Accept comma/newline separated entries; every entry is joined
          # onto the full ghcr image name so a bare tag (e.g. "2409" from
          # "latest, 2409") can never be pushed to Docker Hub by mistake.
          TAGS=""
          while IFS= read -r entry; do
            entry="${entry//[[:space:]]/}"
            [ -n "$entry" ] || continue
            if ! [[ "$entry" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid tag entry: ${entry}" >&2
              exit 1
            fi
            TAGS="${TAGS:+${TAGS},}${IMAGE}:${entry}"
          done < <(printf '%s' "$TAG_INPUT" | tr ',' '\n')
          [ -n "$TAGS" ] || { echo "No tags resolved." >&2; exit 1; }
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
